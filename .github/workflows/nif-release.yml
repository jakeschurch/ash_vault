# Build the `ashvault_nif` NIF for every target `AshVaultRustler.Native` lists, and attach
# the artifacts to a release.
#
# This is the half of `rustler_precompiled` that cannot be done on a developer machine: the
# switch in `AshVaultRustler.Native` stays off until artifacts exist at the `base_url` it
# points at, because a `base_url` aimed at a release that is not there turns every
# `mix test` in every consuming project into a NIF load failure.
#
# Run it by pushing a tag of the form `ash_vault_rustler-v<version>`, matching the
# `base_url` that `AshVaultRustler.Native` builds. `workflow_dispatch` is there so the
# matrix can be proved green before a tag is cut and a bad release has to be deleted.
#
# After it succeeds, see "Releasing a precompiled NIF" in `ash_vault_rustler/README.md`
# for the two remaining steps: generate and commit the checksum file, then flip
# `@precompiled_by_default`.
name: NIF release

on:
  push:
    tags:
      - "ash_vault_rustler-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build artifacts for, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        # `nif` is the NIF API version, not the OTP release. rustler_precompiled names
        # artifacts by it, and an artifact built for 2.16 loads on every OTP that speaks
        # 2.16 or later, so one build per target covers OTP 24+.
        include:
          - { target: x86_64-unknown-linux-gnu,    os: ubuntu-22.04,    nif: "2.16" }
          - { target: aarch64-unknown-linux-gnu,   os: ubuntu-24.04-arm, nif: "2.16" }
          - { target: x86_64-unknown-linux-musl,   os: ubuntu-22.04,    nif: "2.16", musl: true }
          - { target: aarch64-unknown-linux-musl,  os: ubuntu-24.04-arm, nif: "2.16", musl: true }
          - { target: x86_64-apple-darwin,         os: macos-14,        nif: "2.16" }
          - { target: aarch64-apple-darwin,        os: macos-14,        nif: "2.16" }

    steps:
      - uses: actions/checkout@v4

      - name: Extract the version
        id: version
        shell: bash
        run: |
          # ash_vault_rustler-v1.2.3 -> 1.2.3; workflow_dispatch passes it directly.
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#ash_vault_rustler-v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building v${version} for ${{ matrix.target }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tooling
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the NIF
        shell: bash
        working-directory: ash_vault_rustler/native/ashvault_nif
        env:
          # rustler reads this to pick the NIF API version it compiles against.
          RUSTLER_NIF_VERSION: ${{ matrix.nif }}
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package it the way rustler_precompiled expects
        id: package
        shell: bash
        working-directory: ash_vault_rustler/native/ashvault_nif
        run: |
          set -euo pipefail
          # The name is not ours to choose. RustlerPrecompiled builds it in
          # lib_name/4 + lib_name_with_ext/2 as
          #   lib<basename>-v<version>-nif-<nif>-<target>.so.tar.gz
          # and downloads exactly that; a mismatch is a silent 404 for consumers.
          name="libashvault_nif-v${{ steps.version.outputs.version }}-nif-${{ matrix.nif }}-${{ matrix.target }}.so"

          built="target/${{ matrix.target }}/release/libashvault_nif.so"
          # macOS produces a .dylib; the extension rustler_precompiled asks for is still .so.
          [ -f "$built" ] || built="target/${{ matrix.target }}/release/libashvault_nif.dylib"
          test -f "$built"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$built" "$GITHUB_WORKSPACE/artifacts/${name}"
          tar -czf "$GITHUB_WORKSPACE/artifacts/${name}.tar.gz" -C "$GITHUB_WORKSPACE/artifacts" "${name}"
          rm "$GITHUB_WORKSPACE/artifacts/${name}"

          echo "artifact=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -la "$GITHUB_WORKSPACE/artifacts"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: artifacts/${{ steps.package.outputs.artifact }}
          if-no-files-found: error

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/${{ steps.package.outputs.artifact }}
